name: Build and Push Docker Image

on:
  push:
    branches: [main, 6.13.6]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight version pins
        run: |
          echo "5090 Dockerfile INVOKEAI_VERSION pin:"
          grep -E '^ARG INVOKEAI_VERSION=' Dockerfile || true
          echo "4090 Dockerfile InvokeAI install pin:"
          grep -E 'invokeai==' Dockerfile.4090 || true

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stability-matrix-runpod
          # Produces: branch name (e.g. "main") + short SHA — no bare "latest" tag
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stability-matrix-runpod:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stability-matrix-runpod:buildcache,mode=max

  # Manual only (workflow_dispatch) — the 5090/default image covers ~99% of
  # usage, so this doesn't run on every push to main. Trigger it from the
  # Actions tab (or `gh workflow run build.yml`) when a 4090 image is needed.
  build-4090:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight version pins
        run: |
          echo "5090 Dockerfile INVOKEAI_VERSION pin:"
          grep -E '^ARG INVOKEAI_VERSION=' Dockerfile || true
          echo "4090 Dockerfile InvokeAI install pin:"
          grep -E 'invokeai==' Dockerfile.4090 || true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.4090
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/stability-matrix-runpod:main-4090
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stability-matrix-runpod:buildcache-4090
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/stability-matrix-runpod:buildcache-4090,mode=max
