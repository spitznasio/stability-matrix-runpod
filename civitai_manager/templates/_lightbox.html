<dialog id="lightbox" class="lightbox">
  <button type="button" class="lightbox__close" onclick="document.getElementById('lightbox').close()">&times;</button>
  <div class="lightbox__body">
    <img class="lightbox__image" id="lightbox-image" src="" alt="">
    <div class="lightbox__panel" id="lightbox-panel"></div>
  </div>
</dialog>

<script>
  (function () {
    var dialog = document.getElementById('lightbox');
    var image = document.getElementById('lightbox-image');
    var panel = document.getElementById('lightbox-panel');

    // navigator.clipboard needs a secure context (https, or localhost) — this
    // app is often reached over plain http on a pod's public IP, so fall back
    // to the legacy execCommand path there instead of silently doing nothing.
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        document.body.removeChild(area);
        ok ? resolve() : reject(new Error('copy failed'));
      });
    }

    function copyButton(ariaLabel, text, buttonText) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = buttonText || 'Copy';
      btn.setAttribute('aria-label', 'Copy ' + ariaLabel);
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var original = buttonText || 'Copy';
        copyText(text).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('copy-btn--done');
          setTimeout(function () {
            btn.textContent = original;
            btn.classList.remove('copy-btn--done');
          }, 1200);
        }).catch(function () {
          btn.textContent = 'Failed';
          setTimeout(function () { btn.textContent = original; }, 1200);
        });
      });
      return btn;
    }

    // Prompt text comes from untrusted CivitAI uploads — build DOM nodes with
    // textContent rather than innerHTML strings so it can never be parsed as markup.
    function field(label, value) {
      if (!value) return null;
      var wrap = document.createElement('div');
      wrap.className = 'lightbox__field';
      var labelRow = document.createElement('div');
      labelRow.className = 'lightbox__label-row';
      var l = document.createElement('span');
      l.className = 'lightbox__label';
      l.textContent = label;
      labelRow.append(l, copyButton(label, value));
      var p = document.createElement('p');
      p.className = 'lightbox__value';
      p.textContent = value;
      wrap.append(labelRow, p);
      return wrap;
    }

    function chip(label, value) {
      if (!value) return null;
      var el = document.createElement('span');
      el.className = 'chip';
      el.textContent = label + ' ' + value;
      return el;
    }

    // Delegated on document (not bound per-button) because htmx swaps in new
    // thumbnails when the version gallery loads — direct listeners wouldn't
    // reach those.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.thumb');
      if (!btn) return;

      var d = btn.dataset;
      image.src = d.url;
      panel.replaceChildren();

      if (!d.prompt && !d.negative && !d.sampler) {
        var empty = document.createElement('p');
        empty.className = 'lightbox__empty';
        empty.textContent = 'No generation data was published with this image.';
        panel.append(empty);
      } else {
        var chips = document.createElement('div');
        chips.className = 'lightbox__chips';
        [chip('Sampler', d.sampler), chip('Steps', d.steps), chip('CFG', d.cfg), chip('Seed', d.seed)]
          .filter(Boolean)
          .forEach(function (c) { chips.append(c); });

        if (d.prompt && d.negative) {
          var bothRow = document.createElement('div');
          bothRow.className = 'lightbox__copy-both';
          bothRow.append(copyButton(
            'both prompts',
            'Positive: ' + d.prompt + '\n\nNegative: ' + d.negative,
            'Copy both'
          ));
          panel.append(bothRow);
        }

        [field('Prompt', d.prompt), field('Negative prompt', d.negative)]
          .filter(Boolean)
          .forEach(function (f) { panel.append(f); });
        panel.append(chips);
      }
      dialog.showModal();
    });

    dialog.addEventListener('click', function (e) {
      if (e.target === dialog) dialog.close();
    });
  })();
</script>
